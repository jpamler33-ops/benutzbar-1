name: Train human drum groove model
on:
  push:
    branches: [main]
    paths:
      - 'tools/train_grooves.py'
      - '.github/workflows/train-licensed-grooves.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install lightweight MIDI parser
        run: python3 -m pip install --disable-pip-version-check mido==1.3.3
      - name: Download, verify and train human MIDI drum grooves
        run: python3 tools/train_grooves.py --output groove-model.json
      - name: Validate provenance and model statistics
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open('groove-model.json'))
          assert m['schema']=='beatforge.gmd.rhythm-model.v1' and m['trained']
          assert m['meta']['performances_total']>=30
          assert m['meta']['samples_used']>=120
          assert m['meta']['license']=='CC BY 4.0'
          for lane in m['lanes']:
            assert len(m['data']['all']['p'][lane])==16
          print('VALID:',m['meta']['samples_used'],'human-played drum bars')
          PY
      - name: Commit trained probability model
        run: |
          git config user.name 'beatforge-training-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add groove-model.json
          if ! git diff --cached --quiet; then
            git commit -m 'Train real human groove model from Google GMD [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
